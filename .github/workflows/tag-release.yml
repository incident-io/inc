name: Release on SDK bump

# Bumps sdk-go to latest and, if that changed anything, releases it.
#
# This is the only automated release path. Everything else is released by hand
# (see RELEASING.md), so a run that finds no new SDK version does nothing, even
# if other work is sitting unreleased on master.
#
# It asks a question on a timer rather than reacting to an event, so a failed run
# changes nothing and the next run retries the same work.
on:
  schedule:
    - cron: "0 8 * * *" # daily, 08:00 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-on-sdk-bump
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds the bot PAT. Its deployment branch policy allows master, which a
    # scheduled run needs in order to read the secret at all.
    environment: release
    permissions:
      contents: write # commit the bump, push the tag
      pull-requests: write # open and auto-merge the bump PR
      actions: write # dispatch release.yml
      issues: write # report a failed run
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # need tags for git describe

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'

      - id: bump
        name: Bump sdk-go
        run: |
          set -euo pipefail
          go get github.com/incident-io/sdk-go@latest
          go mod tidy

          if git diff --quiet go.mod go.sum; then
            echo "Already on the latest sdk-go."
            echo "bumped=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(go list -m -f '{{.Version}}' github.com/incident-io/sdk-go)"
          echo "bumped=yes" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${version}"

      # The gate. Unit tests on their own don't prove much about an SDK bump, so
      # this builds the binary the release would ship and runs it. A bump that
      # compiles but breaks a command fails here, before anything is merged.
      - name: Verify the built binary
        if: steps.bump.outputs.bumped == 'yes'
        run: |
          set -euo pipefail
          go build -o /tmp/inc .
          /tmp/inc --version
          /tmp/inc describe > /dev/null
          /tmp/inc incidents list --dry-run --api-key unused \
            --api-url https://api.incident.io > /dev/null

      - id: merge
        name: Land the bump on master
        if: steps.bump.outputs.bumped == 'yes'
        env:
          # The PAT, not GITHUB_TOKEN. A PR opened by GITHUB_TOKEN receives no
          # status checks, so the required checks on master would never report
          # and auto-merge would wait until the poll below gave up.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          # Master is protected, so the bump can't be pushed directly. It goes
          # through a PR that this merges itself.
          branch="sdk-bump/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump github.com/incident-io/sdk-go to ${VERSION}"
          git push origin "$branch"

          pr="$(gh pr create --base master --head "$branch" \
            --title "Bump github.com/incident-io/sdk-go to ${VERSION}" \
            --body "Automated bump. Released as a patch version once merged.")"
          echo "Opened ${pr}"

          # Wait for the required checks, then merge. Deliberately not
          # `--auto`: auto-merge outlives this job, so a timeout here would
          # merge and release later while the run had already reported failure.
          #
          # `--watch` only watches checks that already exist and exits 1 with
          # "no checks reported" if none have registered yet, and the PR is
          # seconds old at this point. No pipeline in the wait loop: gh exits
          # non-zero while checks are absent or pending, and under `pipefail`
          # that status would propagate through a pipe and read as success.
          for _ in $(seq 1 18); do
            out="$(gh pr checks "$pr" 2>&1 || true)"
            case "$out" in
              *"no checks reported"*) sleep 10 ;;
              *) break ;;
            esac
          done

          gh pr checks "$pr" --required --watch --fail-fast

          # REST, not `gh pr merge`, which calls the GraphQL mergePullRequest
          # mutation that a fine-grained PAT cannot use. This endpoint needs
          # only Contents: write. The response carries the squash commit, so
          # this also avoids a GraphQL read to find it.
          sha="$(gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr##*/}/merge" \
            -f merge_method=squash --jq .sha)"

          # Squashing creates a new commit, so the tag goes on that rather than
          # on anything in this checkout.
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Tag
        if: steps.bump.outputs.bumped == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0)"

          # Patch, always. inc exports no API, so there's nothing to compare;
          # minor and major releases are cut by hand.
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"

          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${SHA}" > /dev/null
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Tagged ${next} at ${SHA}"

      - name: Release
        if: steps.bump.outputs.bumped == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.tag.outputs.next }}
        run: |
          # A tag created with GITHUB_TOKEN doesn't trigger workflows, so
          # release.yml is started explicitly. workflow_dispatch is exempt from
          # that rule.
          gh workflow run release.yml --ref "$NEXT"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Scheduled runs only email the workflow file's author, so the issue is
          # what actually reaches anyone.
          gh issue create \
            --title "Automated SDK release failed" \
            --body "Nothing was released. The next scheduled run will retry.

          Run: $RUN_URL"
