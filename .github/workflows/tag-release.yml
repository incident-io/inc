name: Release on SDK bump

# Schedule -> bump sdk-go -> CI passes -> release. No human step.
#
# Everything is done with the bot PAT rather than GITHUB_TOKEN, and that is
# load-bearing in two places. GITHUB_TOKEN cannot land a commit on master at all
# (protected branch, and a PR it opens never receives status checks, so the
# required checks can never pass). And a tag it pushes would not trigger
# release.yml, because GitHub suppresses workflow runs from events it caused.
# Events from a PAT do neither of those things.
on:
  schedule:
    - cron: "0 8 * * *" # daily, 08:00 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-on-sdk-bump
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds the bot PAT. The environment's deployment branch policy has to allow
    # master, or a scheduled run cannot read the secret.
    environment: release
    permissions:
      issues: write # report a failed run
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # need tags to work out the next version
          # No token here, and no persisted credential. The next step downloads
          # sdk-go@latest and `go test` executes it, so nothing this job holds may
          # be readable from the working tree: a compromised upstream would
          # otherwise find a push-capable PAT in .git/config. The steps that need
          # the PAT take it in their own env instead.
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'

      - id: bump
        name: Bump sdk-go
        run: |
          set -euo pipefail
          go get github.com/incident-io/sdk-go@latest
          go mod tidy

          if git diff --quiet go.mod go.sum; then
            echo "Already on the latest sdk-go."
            echo "bumped=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$(go list -m -f '{{.Version}}' github.com/incident-io/sdk-go)" >> "$GITHUB_OUTPUT"
          echo "bumped=yes" >> "$GITHUB_OUTPUT"

      # CI will run this too, on the PR. Doing it here as well means a broken bump
      # never opens a PR, and it covers the one thing CI doesn't: running the
      # binary a release would actually ship.
      - name: Verify
        if: steps.bump.outputs.bumped == 'yes'
        run: |
          set -euo pipefail
          go test ./...
          go build -o /tmp/inc .
          /tmp/inc --version
          /tmp/inc describe > /dev/null
          /tmp/inc incidents list --dry-run --api-key unused \
            --api-url https://api.incident.io > /dev/null

      - id: land
        name: Open the bump PR and let CI gate it
        if: steps.bump.outputs.bumped == 'yes'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          # actions/checkout doesn't set an identity, and git refuses to commit
          # without one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="sdk-bump/${VERSION}"
          git switch -c "$branch"
          git commit -am "Bump github.com/incident-io/sdk-go to ${VERSION}"

          # The checkout persisted no credential, so the token goes on this one
          # push rather than into .git/config where test code could read it.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$branch"

          pr="$(gh pr create --base master --head "$branch" \
            --title "Bump github.com/incident-io/sdk-go to ${VERSION}" \
            --body "Automated. Released as a patch version once CI passes." \
            --label dependencies)"

          # build, lint and test are required on master, so this only merges if
          # they pass. That is the CI gate.
          gh pr merge "$pr" --auto --squash

          for _ in $(seq 1 45); do
            state="$(gh pr view "$pr" --json state --jq .state)"
            case "$state" in
              MERGED) break ;;
              CLOSED) echo "PR closed without merging." >&2; exit 1 ;;
            esac
            sleep 20
          done

          if [[ "$(gh pr view "$pr" --json state --jq .state)" != "MERGED" ]]; then
            echo "CI did not pass, or the merge did not happen within 15 minutes." >&2
            exit 1
          fi

          # Squashing makes a new commit, so the tag goes on that rather than on
          # anything in this checkout.
          echo "sha=$(gh pr view "$pr" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.bump.outputs.bumped == 'yes'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SHA: ${{ steps.land.outputs.sha }}
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0)"

          # Patch, always. inc exports no API, so there is nothing to compare;
          # minor and major releases are cut by hand.
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"

          # Pushed with the PAT, so this tag triggers release.yml on its own.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${SHA}" > /dev/null
          echo "Tagged ${next} at ${SHA}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Scheduled runs only email the workflow file's author, so the issue is
          # what actually reaches anyone.
          gh issue create \
            --title "Automated SDK release failed" \
            --body "Nothing was released. The next scheduled run will retry.

          Run: $RUN_URL"
